server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Web se ladí do poslední chvíle — bez tohohle Cloudflare drží .js/.css
    # ve své cache 4 hodiny a změny se k návštěvníkovi nedostanou.
    add_header Cache-Control "no-store, must-revalidate" always;

    location ~ /\. {
        deny all;
    }
    location = /docker-compose.yml {
        deny all;
    }
    location = /nginx.conf {
        deny all;
    }
}
